
[EMC]
MACHINE = udp-test
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
GRIDS = 10mm 20mm 50mm 100mm 1in 2in 5in 10in
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 10.0
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 500.0
CYCLE_TIME = 0.100
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 1
PROGRAM_PREFIX = ../../nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm
PYVCP = udp-display.xml
OPEN_FILE = udp-test.ngc

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[FILTER]

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = udp-test.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 500000
UDP_PERIOD = 500000

[HAL]
HALUI = halui
HALFILE = udp-test.hal
POSTGUI_HALFILE  = udp-display.hal

[HALUI]
# add halui MDI commands here (max 64) 

[TRAJ]
COORDINATES =  X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 500.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = udp-test.tbl

#*** AXIS_X *******************************
[AXIS_X]
# MAX_VELOCITY = PID_MAXOUTPUT * 0.9
MAX_VELOCITY = 270.0
# MAX_ACCELERATION = STEPGEN_MAXACCEL * 0.8
MAX_ACCELERATION = 480.0
MIN_LIMIT = -1000.1
MAX_LIMIT = 1000.1

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -1000.1
MAX_LIMIT = 1000.1
# MAX_VELOCITY = PID_MAXOUTPUT * 0.9
MAX_VELOCITY = 270.0
# MAX_ACCELERATION = STEPGEN_MAXACCEL * 0.8
MAX_ACCELERATION = 480.0
SCALE = 320
FERROR = 1
MIN_FERROR = .1
HOME_OFFSET = 0.0
HOME_SEQUENCE =  1

STEPGEN_DIRSETUP = 10000
STEPGEN_MAXACCEL = 600

PID_GAIN_P       = 400
PID_GAIN_I       = 0
PID_GAIN_D       = 0
PID_BIAS         = 0
PID_FF0          = 0
PID_FF1          = 1
PID_FF2          = 0
